[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "radix-proofpath"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "python-multipart>=0.0.18", "python-dotenv>=1,<2", "httpx>=0.27,<1", "pypdf>=5,<7", "python-docx>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "mypy>=1.14", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["apps*", "shared*", "jd_analytics*", "resume_parsing*", "profile_builder*", "talent_check*", "skill_matching*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests", "jd_analytics/tests", "resume_parsing/tests", "profile_builder/tests", "talent_check/tests", "skill_matching/tests"]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = [".venv", ".venv-deploy", "node_modules", "deploy/hf-space*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
exclude = [".venv", "node_modules"]
